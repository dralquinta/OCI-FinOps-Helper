name: Standalone binary
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'build.sh'
      - 'requirements-build.txt'
      - '.github/workflows/build-binary.yml'
jobs:
  linux-x86-64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oci-finops-helper-linux-x86-64
          path: dist/oci-finops-helper
